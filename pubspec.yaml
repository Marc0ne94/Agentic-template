name: agentic_template
description: "A clean, modular Flutter template designed for agentic AI pair-programming, following strict Feature-Sliced Design (FSD v2.1) with Wearable, Foldable, Smartphone (Android, iOS), Web and Desktop (Windows, macOS, Linux) layouts."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
