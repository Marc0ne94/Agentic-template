name: agentic_template
description: "A clean, modular Flutter template designed for agentic AI pair-programming, following strict Feature-Sliced Design (FSD v2.1) with Wearable, Foldable, Smartphone, Web, Windows and Linux desktop layouts."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
