name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-regressions:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup script regression tests
        shell: bash
        run: bash test/tool/setup_check_test.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: FSD architecture audit
        run: dart run tool/verify_fsd.dart --strict

      - name: Tests
        run: flutter test
